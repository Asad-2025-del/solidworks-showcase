<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Apex Engineering Group</title>
    <script>
      // SPA fallback for GitHub Pages: redirect deep links to index.html with the path encoded.
      (function () {
        var segmentCount = 0; // set to 1 if hosted under /repo-name/
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + segmentCount)
              .join("/") +
            "/?/" +
            l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
